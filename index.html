<!doctype html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('click-to-color', {
        schema: { color: { default: 'lightgreen' } },
        init: function () {
          var el = this.el;
          var original = el.getAttribute('color');
          var toggled = false;
          el.addEventListener('click', function () {
            toggled = !toggled;
            el.setAttribute('color', toggled ? this.data.color : original);
          }.bind(this));
        }
      });

      // Touchpad locomotion: put on the rig, point it at the controller
      AFRAME.registerComponent('move-with-arrows', {
        schema: {
          speed: { default: 2 },              // meters per second
          controller: { type: 'selector' }    // entity that emits axismove
        },
        init: function () {
          this.axis = { x: 0, y: 0 };
          var src = this.data.controller || this.el;
          var self = this;
          src.addEventListener('axismove', function (evt) {
            self.axis.x = evt.detail.axis[0];
            self.axis.y = evt.detail.axis[1];
          });
          // Stop when thumb leaves the touchpad
          src.addEventListener('trackpadtouchend', function () {
            self.axis.x = 0; self.axis.y = 0;
          });
        },
        tick: function (time, timeDelta) {
          if (!timeDelta) return;
          var x = this.axis.x, y = this.axis.y;
          if (Math.abs(x) < 0.1 && Math.abs(y) < 0.1) return; // dead zone

          var d = this.data.speed * (timeDelta / 1000);
          var yaw = this.el.sceneEl.camera.el.object3D.rotation.y;
          var sin = Math.sin(yaw), cos = Math.cos(yaw);

          var p = this.el.object3D.position;  // mutate directly, no setAttribute
          p.x += (x * cos + y * sin) * d;
          p.z += (y * cos - x * sin) * d;
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-entity id="rig" position="0 0 0"
                move-with-arrows="controller: #rightHand; speed: 2">
        <a-camera id="camera" wasd-controls="enabled: false"
                  cursor="rayOrigin: mouse"
                  raycaster="objects: .clickable"></a-camera>

        <a-entity id="rightHand" laser-controls="hand: right"
                  raycaster="objects: .clickable; far: 20"
                  line="color: #00e5ff; opacity: 0.8"></a-entity>
      </a-entity>

      <a-box class="clickable" click-to-color position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere class="clickable" click-to-color position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-sphere class="clickable" position="20 1.25 -5" radius="10" color="#EF2D5E"></a-sphere>
      <a-cylinder class="clickable" click-to-color position="1 0.75 -3" radius="0.6" height="2" color="#FFC65D"></a-cylinder>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
