<!doctype html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('click-to-color', {
        schema: { color: { default: 'lightgreen' } },
        init: function () {
          var el = this.el;
          var original = el.getAttribute('color');
          var toggled = false;
          el.addEventListener('click', function () {
            console.log('Clicked:', el.tagName);
            toggled = !toggled;
            el.setAttribute('color', toggled ? this.data.color : original);
          }.bind(this));
        }
      });

      //Player Controls
      AFRAME.registerComponent('move-with-arrows', {
  schema: {
    speed: { type: 'number', default: 5 } // Units per second
  },

  init: function () {
    // Keep track of which keys are currently pressed
    this.keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false
    };

    // Bind event handlers
    this.onKeyDown = this.onKeyDown.bind(this);
    this.onKeyUp = this.onKeyUp.bind(this);

    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('keyup', this.onKeyUp);
  },

  remove: function () {
    window.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('keyup', this.onKeyUp);
  },

  onKeyDown: function (evt) {
    if (evt.code in this.keys) {
      this.keys[evt.code] = true;
    }
  },

  onKeyUp: function (evt) {
    if (evt.code in this.keys) {
      this.keys[evt.code] = false;
    }
  },

  // The tick function runs on every frame of the A-Frame render loop
  tick: function (time, timeDelta) {
    // Convert timeDelta from milliseconds to seconds
    const dt = timeDelta / 1000;
    const speed = this.data.speed;
    const distance = speed * dt;

    // Get the current position object of the entity
    const position = this.el.getAttribute('position');

    // Update coordinates based on active keys
    if (this.keys.ArrowUp)    position.z -= distance; // Move forward (negative Z)
    if (this.keys.ArrowDown)  position.z += distance; // Move backward (positive Z)
    if (this.keys.ArrowLeft)  position.x -= distance; // Move left (negative X)
    if (this.keys.ArrowRight) position.x += distance; // Move right (positive X)

    // Apply the updated position back to the entity
    this.el.setAttribute('position', position);
  }
});

    </script>
  </head>
  <body>
    <a-scene>
      <a-entity id="rig" move-with-arrows="speed: 8" position="0 0 0">
        <a-camera id="camera" wasd-controls="enabled: false"
                  cursor="rayOrigin: mouse"
                  raycaster="objects: .clickable"></a-camera>

        <!-- Real tracked Go controller with laser + raycaster -->
        <a-entity laser-controls="hand: right"
                  raycaster="objects: .clickable; far: 20"
                  line="color: #00e5ff; opacity: 0.8"></a-entity>
      </a-entity>

      <a-box class="clickable" click-to-color position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere class="clickable" click-to-color position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-sphere class="clickable" position="20 1.25 -5" radius="10" color="#EF2D5E"></a-sphere>
      <a-cylinder class="clickable" click-to-color position="1 0.75 -3" radius="0.6" height="2" color="#FFC65D"></a-cylinder>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
